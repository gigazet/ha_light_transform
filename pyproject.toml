[project]
name = "ha-light-transform"
version = "0.2.0"
description = "Configurable electrical-channel facades for Home Assistant lights"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "homeassistant==2026.9.3",
  "pytest-homeassistant-custom-component",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
  "mypy>=1.16",
  "pillow>=11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/light_transform"]
