name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --python 3.14
      - run: uv run python -m pytest -q --timeout=30
      - run: uv run ruff check custom_components tests scripts
      - run: uv run ruff format --check custom_components tests scripts
      - run: uv run mypy
      - run: uv run python scripts/package_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: light-transform
          path: dist/light_transform.zip
